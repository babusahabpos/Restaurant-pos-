<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BaBu SAHAB POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              lemon: '#FFFF00',
              'lemon-dark': '#E6E600',
            }
          }
        }
      }
    </script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
      html, body {
        height: 100%;
        overflow: hidden;
        position: fixed;
        width: 100%;
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
        background-color: black;
      }
      #root { height: 100%; overflow: hidden; }
      body { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
      input, textarea { -webkit-user-select: text; user-select: text; }
      
      #initial-loader {
        position: fixed;
        inset: 0;
        background: black;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .loader-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #FFFF00;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .panic-btn {
        margin-top: 30px;
        padding: 10px 20px;
        background: #111;
        color: #555;
        border: 1px solid #222;
        border-radius: 12px;
        font-size: 9px;
        font-family: monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s;
      }
      .panic-btn:hover { background: #222; color: #ff4444; border-color: #ff4444; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@17.0.2",
    "react-dom": "https://esm.sh/react-dom@17.0.2",
    "react/jsx-runtime": "https://esm.sh/react@17.0.2/jsx-runtime",
    "recharts": "https://esm.sh/recharts@2.12.7?deps=react@17.0.2,react-dom@17.0.2",
    "@google/genai": "https://esm.sh/@google/genai@1.33.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
<script>
    window.onerror = function(msg, url, line) {
        console.error("BOOT_ERROR:", msg);
        const status = document.getElementById('loader-status');
        if (status) {
            status.innerText = "Error: " + msg;
            status.style.color = "#ff4444";
        }
    };
    
    function resetSystemCache() {
        if(confirm("সতর্কবার্তা: এটি আপনার সমস্ত তথ্য মুছে ফেলবে। আপনি কি নিশ্চিত?")) {
            localStorage.clear();
            sessionStorage.clear();
            window.location.reload();
        }
    }
</script>
</head>
  <body class="bg-black text-white">
    <div id="root"></div>
    <div id="initial-loader">
        <div class="loader-spinner"></div>
        <p style="color: #FFFF00; font-family: sans-serif; font-weight: 900; margin-top: 16px; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;">BaBu SAHAB POS</p>
        <p id="loader-status" style="color: #444; font-family: sans-serif; font-weight: 900; margin-top: 8px; font-size: 8px; text-transform: uppercase;">BOOTING KERNEL...</p>
        <button class="panic-btn" onclick="resetSystemCache()">[ RESET SYSTEM ]</button>
    </div>
    <audio id="notification-sound" src="https://assets.mixkit.co/sfx/preview/mixkit-positive-notification-951.mp3" preload="auto"></audio>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
